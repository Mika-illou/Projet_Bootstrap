<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agritech - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="d-flex justify-content-center align-items-center text-center mb-4">
        <img src="./image/favico.png" alt="logo" width="80" class="mb-2">
        <h2 class="fw-semibold">Agritech App</h2>
    </div>

    <div class="login-card p-4 rounded-4 shadow-lg mx-auto">
        <h3 class="text-center text-white mb-4">Login</h3>
        <form action="home.html">
            <label class="text-white fw-bold mb-1">
                Veuillez saisir votre Email <span class="text-danger">*</span>
            </label>
            <input type="email" class="form-control mb-3 rounded-3" placeholder="Email">

            <label class="text-white fw-bold mb-1">
                Veuillez saisir votre Mot de Passe<span class="text-danger">*</span>
            </label>
            <input type="password" class="form-control mb-3 rounded-3" placeholder="Password">

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label text-white" for="remember">
                    Se souvenir de moi
                </label>
            </div>

            <div class="text-end">
                <a href="index.html"><button type="submit" class="btn login-btn px-4 py-2 rounded-pill text-white">
                    Login <i class="bi bi-arrow-up-right"></i>
                </button></a>
            </div>
            <p class="text-white mt-4">
                    Veuillez contactez un administrateur si vous avez oublié votre mot de passe
               </p>
        </form>
    </div>
    
</body>
