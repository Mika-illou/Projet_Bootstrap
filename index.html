<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agritech - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid bg-custom min-vh-100 d-flex flex-column justify-content-center align-items-center">

      
        <div class="d-flex text-center mb-4">
            <img src="./image/favico.png"
                 alt="logo"
                 width="50"
                 height="50"
                 border-radius="50"
                 class="mb-2">
            <h1 class="fw-bold text-dark">Agritech App</h1>
        </div>

      
        <div class="card shadow-lg p-4 w-25 card-custom">
            <h2 class="text-center text-white mb-4">Login</h2>

            <form>
                <label class="text-white mb-1">Veuillez saisir votre Email <span>*</span></label>
                <input type="email" class="form-control mb-3" placeholder="Email">

                <label class="text-white mb-1">Veuillez saisir votre Mot de Passe <span>*</span></label>
                <input type="password" class="form-control mb-3" placeholder="Password">

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-white" for="rememberMe">
                        Se souvenir de moi
                    </label>
                </div>
                <div class=" d-flex justify-content-end">

               

                    <button class="btn btn-success w-40 py-2 rounded-pill ">
                        Login →
                    </button>
                 </div>

                <p class="text-white text-start mt-3 small">
                    Veuillez contacter un administrateur si vous avez oublié votre mot de passe
                </p>
            </form>
        </div>
    </div>

</body>
</html>
